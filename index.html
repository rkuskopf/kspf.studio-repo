  <script>
    document.documentElement.classList.add("home-scroll-pending");
    window.kspfHomeReady = { position: false, site: false, home: false, projects: false };
    window.kspfMarkHomeReady = (part) => {
      window.kspfHomeReady[part] = true;
      if (
        window.kspfHomeReady.site &&
        window.kspfHomeReady.home &&
        window.kspfHomeReady.projects &&
        !window.kspfHomeReady.position
      ) {
        window.dispatchEvent(new Event("kspf:content-ready"));
      }
      if (Object.values(window.kspfHomeReady).every(Boolean)) {
        document.documentElement.classList.remove("home-scroll-pending");
      }
    };
    window.setTimeout(() => document.documentElement.classList.remove("home-scroll-pending"), 4000);
  </script>

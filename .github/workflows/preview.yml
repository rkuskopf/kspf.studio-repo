name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: gh-pages-branch
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull published content from Storyblok
        if: github.event.action != 'closed'
        env:
          STORYBLOK_PUBLIC_TOKEN: ${{ secrets.STORYBLOK_PUBLIC_TOKEN }}
          STORYBLOK_REGION: ${{ vars.STORYBLOK_REGION }}
        run: node scripts/sync-storyblok.mjs --target . --version published --optional

      - name: Pre-render CMS content into HTML
        if: github.event.action != 'closed'
        run: node scripts/prerender.mjs .

      - name: Stamp preview and cache revisions
        if: github.event.action != 'closed'
        run: node scripts/prepare-deployment.mjs . "$GITHUB_SHA"

      - name: Deploy Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: . # If your site is in a subfolder, change this

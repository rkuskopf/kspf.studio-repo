name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: gh-pages-branch
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-render CMS content into HTML
        if: github.event.action != 'closed'
        run: node scripts/prerender.mjs .

      - name: Deploy Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: . # If your site is in a subfolder, change this

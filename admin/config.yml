backend:
  name: github
  repo: rkuskopf/kspf.studio-repo
  branch: main
  base_url: https://dms-cms-proxy.studio-3cc.workers.dev
  auth_endpoint: /auth

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "experience"
    label: "Experience Page"
    files:
      - file: "content/experience.json"
        label: "Hero"
        name: "hero"
        fields:
          - { label: "Nav Intro Text", name: "navIntro", widget: "text" }
          - { label: "Hero Text", name: "heroText", widget: "text" }
          - { label: "CTA Label", name: "ctaLabel", widget: "string" }
          - { label: "CTA Link", name: "ctaHref", widget: "string" }

  - name: "caseStudies"
    label: "Case Studies"
    folder: "content/case-studies"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Role Label", name: "roleLabel", widget: "string" }
      - { label: "Role Value", name: "roleValue", widget: "string" }
      - label: "Slides"
        name: "slides"
        widget: "list"
        field: { label: "Slide", name: "slide", widget: "image" }
      - label: "Tabs"
        name: "tabs"
        widget: "list"
        summary: "{{fields.label}}"
        min: 1
        fields:
          - label: "Key"
            name: "key"
            widget: "select"
            options:
              - { label: "Challenge", value: "problem" }
              - { label: "Approach", value: "uncovered" }
              - { label: "Design principles", value: "principles" }
              - { label: "The solution", value: "solution" }
          - { label: "Label", name: "label", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - { label: "Body", name: "body", widget: "text", required: false }
          - label: "Layout"
            name: "layout"
            widget: "select"
            options:
              - { label: "Media + text", value: "media" }
              - { label: "Text + list", value: "list" }
            default: "media"
          - label: "List Items"
            name: "items"
            widget: "list"
            required: false
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Slides"
            name: "slides"
            widget: "list"
            field: { label: "Slide", name: "slide", widget: "image" }

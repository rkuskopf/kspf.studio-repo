backend:
  name: github
  repo: rkuskopf/kspf.studio-repo
  branch: main
  base_url: https://dms-cms-proxy.studio-3cc.workers.dev
  auth_endpoint: /auth

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "experience"
    label: "Experience Page"
    files:
      - file: "content/experience.json"
        label: "Hero"
        name: "hero"
        fields:
          - { label: "Nav Intro Text", name: "navIntro", widget: "text" }
          - { label: "Hero Text", name: "heroText", widget: "text" }
          - { label: "CTA Label", name: "ctaLabel", widget: "string" }
          - { label: "CTA Link", name: "ctaHref", widget: "string" }

  - name: "caseStudies"
    label: "Case Studies"
    folder: "content/case-studies"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Role Label", name: "roleLabel", widget: "string" }
      - { label: "Role Value", name: "roleValue", widget: "string" }
      - label: "Slides"
        name: "slides"
        widget: "list"
        field: { label: "Slide", name: "slide", widget: "image" }

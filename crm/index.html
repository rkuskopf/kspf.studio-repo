<script>
// ── PIN gate ──────────────────────────────────────────────────────────────
// Client-side PIN check via SHA-256 (obfuscation layer — not server-side auth).
// To change the PIN: node -e "const c=require('crypto');console.log(c.createHash('sha256').update('YOUR_PIN').digest('hex'));"
const CORRECT_HASH = "a767c0c2f25b2c77a042722b83161d98516dae4389db303845cbbddac74ae97f";
const SESSION_KEY  = "kspf_crm_auth";

async function sha256hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function unlock() {
  document.getElementById("pin-gate").classList.add("hidden");
  document.getElementById("main").classList.add("visible");
  render();
}

// Wire up PIN gate handlers (always — unlock() closes over render which is defined below)
{
  const input = document.getElementById("pin-input");
  const errEl = document.getElementById("pin-error");

  async function attempt() {
    const val = input.value.trim();
    if (!val) return;
    const hash = await sha256hex(val);
    if (hash === CORRECT_HASH) {
      sessionStorage.setItem(SESSION_KEY, "1");
      unlock();
    } else {
      errEl.textContent = "Incorrect PIN — try again.";
      input.value = "";
      input.focus();
    }
  }

  document.getElementById("pin-form").addEventListener("submit", attempt);
}

{b:"seed",name:"Palace Coffee",url:"https://palacecoffee.com.au",cat:"hospitality",status:"Seed only",email:null,perf:null,a11y:null,bp:null,seo:null,pri:null,issue:"Not audited",angle:"—",brand:"—",gemini:""},
{b:"seed",name:"Grown Alchemist",url:"https://grownalchemist.com",cat:"beauty",status:"Seed only",email:null,perf:null,a11y:null,bp:null,seo:null,pri:null,issue:"Not audited",angle:"—",brand:"—",gemini:""},
];

const SK="kspf_v3";
let sv=()=>{try{return JSON.parse(localStorage.getItem(SK)||"{}");}catch{return{};}};
let S=sv();
const ps=()=>localStorage.setItem(SK,JSON.stringify(S));
const gs=n=>{if(!S[n])S[n]={r:0,v:"",n:""};return S[n];};

let sCol="pri",sDir=-1,fQ="",fSt="",fCt="";

const sc=(v,c)=>{
  if(v===null||v===undefined)return"<span style='color:#ccc'>—</span>";
  const cls=c==="pri"?(v>=50?"s-ok":v>=35?"s-mid":"s-bad"):(v>=75?"s-ok":v>=55?"s-mid":"s-bad");
  return`<span class="${cls}">${v}</span>`;
};
const BDGE={"Ready to draft":"b-draft","Needs contact":"b-contact","Next wave":"b-wave2","Seed only":"b-seed","Warm":"b-warm"};
const stars=(n,r)=>[1,2,3,4,5].map(i=>`<span class="star${i<=r?" on":""}" data-n="${n.replace(/"/g,"&quot;")}" data-v="${i}">★</span>`).join("");

function filt(){
  return L.filter(l=>{
    if(fQ){const q=fQ.toLowerCase();if(![l.name,l.cat,l.status,l.email||"",l.issue,l.gemini,l.brand].join(" ").toLowerCase().includes(q))return false;}
    if(fSt&&l.status!==fSt)return false;
    if(fCt&&!l.cat.includes(fCt))return false;
    return true;
  }).sort((a,b)=>{
    let av=a[sCol],bv=b[sCol];
    if(av===null||av===undefined)av=sDir===1?99999:-99999;
    if(bv===null||bv===undefined)bv=sDir===1?99999:-99999;
    if(typeof av==="string")av=av.toLowerCase();
    if(typeof bv==="string")bv=bv.toLowerCase();
    return av<bv?-sDir:av>bv?sDir:0;
  });
}

function render(){
  const list=filt();
  document.getElementById("ct").textContent=`${list.length} of ${L.length}`;
  const tb=document.getElementById("tb");
  tb.innerHTML=list.map(l=>{
    const s=gs(l.name);
    return`<tr>
      <td class="pin"><a href="${l.url}" target="_blank">${l.name}</a></td>
      <td>${l.cat}</td>
      <td><span class="badge ${BDGE[l.status]||"b-seed"}">${l.status}</span></td>
      <td style="font-size:11px">${l.email?`<a href="mailto:${l.email}">${l.email}</a>`:`<span class="no-email">—</span>`}</td>
      <td class="sc">${sc(l.perf,"perf")}</td>
      <td class="sc">${sc(l.a11y,"a11y")}</td>
      <td class="sc">${sc(l.bp,"bp")}</td>
      <td class="sc">${sc(l.seo,"seo")}</td>
      <td class="sc">${sc(l.pri,"pri")}</td>
      <td style="font-size:11px;max-width:200px">${l.issue}</td>
      <td class="gcell">${l.gemini?`<span class="gtag">Gemini</span>${l.gemini}`:""}</td>
      <td style="font-size:11px;max-width:180px;color:#555">${l.angle}</td>
      <td style="font-size:11px;max-width:160px;color:#666">${l.brand}</td>
      <td class="stars" data-sf="${l.name}">${stars(l.name,s.r)}</td>
      <td><select class="verdict" onchange="setV('${l.name.replace(/'/g,"\\'")}',this.value)">
        <option value=""${!s.v?" selected":""}>—</option>
        <option value="send"${s.v==="send"?" selected":""}>✓ Send</option>
        <option value="rework"${s.v==="rework"?" selected":""}>~ Rework</option>
        <option value="skip"${s.v==="skip"?" selected":""}>✗ Skip</option>
      </select></td>
      <td><textarea class="note" oninput="setN('${l.name.replace(/'/g,"\\'")}',this.value)">${s.n||""}</textarea></td>
    </tr>`;
  }).join("");
  tb.querySelectorAll(".star").forEach(el=>el.addEventListener("click",e=>{
    const n=e.target.dataset.n,v=parseInt(e.target.dataset.v);
    gs(n).r=v;ps();
    document.querySelectorAll(`[data-sf="${n}"]`).forEach(c=>{c.innerHTML=stars(n,v);bindS(c);});
  }));
}
function bindS(w){w.querySelectorAll(".star").forEach(el=>el.addEventListener("click",e=>{const n=e.target.dataset.n,v=parseInt(e.target.dataset.v);gs(n).r=v;ps();document.querySelectorAll(`[data-sf="${n}"]`).forEach(c=>{c.innerHTML=stars(n,v);bindS(c);});}));}
function setV(n,v){gs(n).v=v;ps();}
function setN(n,v){gs(n).n=v;ps();}

document.querySelectorAll("th[data-c]").forEach(th=>th.addEventListener("click",()=>{
  const c=th.dataset.c;sDir=sCol===c?-sDir:-1;sCol=c;
  document.querySelectorAll("th").forEach(t=>t.classList.remove("sorted"));
  th.classList.add("sorted");render();
}));
document.getElementById("search").addEventListener("input",e=>{fQ=e.target.value;render();});
document.getElementById("fs").addEventListener("change",e=>{fSt=e.target.value;render();});
document.getElementById("fc").addEventListener("change",e=>{fCt=e.target.value;render();});

function xcsv(){
  const cols=["Name","URL","Category","Status","Batch","Email","Perf","A11y","BP","SEO","Priority","Issue","Gemini Findings","Outreach Angle","Brand Observation","Rating","Verdict","Notes"];
  const rows=[cols,...L.map(l=>{const s=gs(l.name);return[l.name,l.url,l.cat,l.status,l.b,l.email||"",l.perf??'',l.a11y??'',l.bp??'',l.seo??'',l.pri??'',l.issue,l.gemini.replace(/\n/g,' '),l.angle,l.brand,s.r||'',s.v||'',(s.n||'').replace(/\n/g,' ')];})];
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="kspf-leads.csv";a.click();
}

// Session check — must run after render() is defined above
if (sessionStorage.getItem(SESSION_KEY) === "1") {
  unlock();
}
</script>
</body>
</html>

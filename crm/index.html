<script>
// ── PIN gate ──────────────────────────────────────────────────────────────
// Client-side PIN check via SHA-256 (obfuscation layer — not server-side auth).
// To change the PIN: node -e "const c=require('crypto');console.log(c.createHash('sha256').update('YOUR_PIN').digest('hex'));"
const CORRECT_HASH = "a767c0c2f25b2c77a042722b83161d98516dae4389db303845cbbddac74ae97f";
const SESSION_KEY  = "kspf_crm_auth";

async function sha256hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function unlock() {
  document.getElementById("pin-gate").classList.add("hidden");
  document.getElementById("main").classList.add("visible");
  setSaveState("saved-local");
  render();
  hydrateFromRepo();
}

// Wire up PIN gate handlers (always — unlock() closes over render which is defined below)
{
  const input = document.getElementById("pin-input");
  const errEl = document.getElementById("pin-error");

  async function attempt() {
    const val = input.value.trim();
    if (!val) return;
    const hash = await sha256hex(val);
    if (hash === CORRECT_HASH) {
      sessionStorage.setItem(SESSION_KEY, "1");
      unlock();
    } else {
      errEl.textContent = "Incorrect PIN — try again.";
      input.value = "";
      input.focus();
    }
  }

  document.getElementById("pin-form").addEventListener("submit", attempt);
}

// ── Rowan review state (issue #720) ───────────────────────────────────────
// Persists Rowan-owned lead review fields keyed by stable id derived from URL.
// Source of truth on disk: data/leads/current/rowan-review.json
// localStorage mirror under SK acts as the offline buffer between commits.
const SK_LEGACY = "kspf_v3";              // old store, keyed by lead.name with {r,v,n}
const SK = "kspf_v4";                     // new store, keyed by leadId(url) with full review shape
const ROWAN_REVIEW_PATH = "../data/leads/current/rowan-review.json";

const LANES = ["technical-audit","brand-translation","intent-signals","warm-relationships","agency-partners","inbound-authority"];
const LANE_CONFIDENCE = ["low","medium","high"];
const EVIDENCE = ["unverified","partially_verified","verified","false"];
const NEXT_ACTIONS = ["manual-check","enrich","draft","redo-audit","send","follow-up","skip","archive"];
const NEXT_ACTION_LABELS = {
  "manual-check": "Manual check",
  enrich: "Enrich",
  draft: "Draft",
  "redo-audit": "Redo audit",
  send: "Send",
  "follow-up": "Follow-up",
  skip: "Skip",
  archive: "Archive",
};
const VERDICTS = [["send","✓ Send"],["rework","~ Rework"],["maybe","? Maybe"],["skip","✗ Skip"]];

function leadId(url){
  return String(url||"")
    .trim()
    .replace(/^https?:\/\//i, "")
    .replace(/^www\./i, "")
    .replace(/\/+$/g, "")
    .toLowerCase()
    .replace(/[\/.]/g, "-")
    .replace(/[^a-z0-9-]/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-+|-+$/g, "");
}

// Tag every lead with its stable id once, up front.
for (const lead of L) { lead.id = leadId(lead.url); }

// Ensure acceptance criteria: every lead has a lane.
// Bootstraps a lightweight default classification that Rowan can override.
// Heuristic: audited leads → technical-audit; seed-only → intent-signals.
for (const lead of L) {
  if (!lead.lane) {
    // Legacy heuristics only (for this embedded dataset):
    // - Warm leads should land in warm-relationships
    // - Seed-only leads are intent-signals
    // - Historic audit batches default to technical-audit
    // Future imports should provide lane explicitly rather than relying on inference.
    if (lead.status === "Warm") lead.lane = "warm-relationships";
    else if (lead.status === "Seed only") lead.lane = "intent-signals";
    else lead.lane = "technical-audit";
  }
}

function blankReview(){
  return { lane:"", lane_confidence:"", verdict:"", evidence_status:"", draft_safe:false, rating:0, notes:"", next_action:"", follow_up_date:null, updated_at:"" };
}

function loadSeedReview(){
  try {
    const el = document.getElementById("rowan-review-seed");
    return el ? JSON.parse(el.textContent || "{}") : {};
  } catch {
    return {};
  }
}

function loadStore(){
  try { return JSON.parse(localStorage.getItem(SK) || "{}"); } catch { return {}; }
}

const LEAD_BY_ID = Object.fromEntries(L.map(lead => [lead.id, lead]));

function normalizedReview(review){
  return { ...blankReview(), ...(review || {}) };
}

function isDefaultOnlyReview(id, review){
  const r = normalizedReview(review);
  const lead = LEAD_BY_ID[id];
  const defaultLane = lead ? (lead.lane || "") : "";
  return (!String(r.notes || "").trim())
    && !r.verdict
    && !r.follow_up_date
    && !r.lane_confidence
    && !(Number(r.rating || 0) > 0)
    && r.draft_safe !== true
    && (!r.next_action || r.next_action === "manual-check")
    && (!r.evidence_status || r.evidence_status === "unverified")
    && (!r.lane || r.lane === defaultLane);
}

function mergeReviewState(seed, local){
  const merged = {};
  const ids = new Set([...Object.keys(seed || {}), ...Object.keys(local || {})]);
  for (const id of ids){
    const fromSeed = seed && seed[id];
    const fromLocal = local && local[id];
    if (fromSeed && fromLocal){
      merged[id] = isDefaultOnlyReview(id, fromLocal)
        ? { ...blankReview(), ...fromLocal, ...fromSeed }
        : { ...blankReview(), ...fromSeed, ...fromLocal };
      continue;
    }
    if (fromSeed){
      merged[id] = { ...blankReview(), ...fromSeed };
      continue;
    }
    merged[id] = { ...blankReview(), ...fromLocal };
  }
  return merged;
}

let S = mergeReviewState(loadSeedReview(), loadStore());

// One-shot migration from kspf_v3 (keyed by lead name, {r,v,n}) → kspf_v4 (keyed by id).
(function migrateLegacy(){
  if (localStorage.getItem(SK)) return;
  let legacy = {};
  try { legacy = JSON.parse(localStorage.getItem(SK_LEGACY) || "{}"); } catch { return; }
  if (!legacy || typeof legacy !== "object") return;
  const byName = {};
  for (const lead of L) byName[lead.name] = lead;
  const now = new Date().toISOString();
  for (const [name, v] of Object.entries(legacy)){
    const lead = byName[name]; if (!lead || !lead.id) continue;
    if (!v || (v.r === 0 && !v.v && !v.n)) continue;
    const r = blankReview();
    if (typeof v.r === "number") r.rating = v.r;
    if (typeof v.v === "string") r.verdict = v.v;
    if (typeof v.n === "string") r.notes = v.n;
    r.updated_at = now;
    S[lead.id] = r;
  }
  try { localStorage.setItem(SK, JSON.stringify(S)); } catch {}
})();

const BLANK = Object.freeze(blankReview());
function peekReview(id){ return S[id] || BLANK; }     // read-only; never mutates S
function ensureReview(id){                            // write-path; auto-creates
  if (!S[id]) S[id] = blankReview();
  return S[id];
}

// Backfill missing per-lead schema so filters + exports behave consistently.
// Only fills empty fields; never overwrites Rowan's explicit values.
(function ensureSchema(){
  const now = new Date().toISOString();
  let changedAny = false;
  for (const lead of L) {
    const id = lead.id;
    const r = ensureReview(id);
    let changed = false;

    if (!r.lane) { r.lane = lead.lane; changed = true; }
    if (!r.evidence_status) { r.evidence_status = "unverified"; changed = true; }
    // draft_safe must be explicitly opted-in: only true after verified evidence or Rowan approval.
    if (r.draft_safe === undefined) { r.draft_safe = false; changed = true; }
    if (!r.next_action) { r.next_action = "manual-check"; changed = true; }

    // Set updated_at only for the specific record(s) we changed.
    if (changed) {
      r.updated_at = now;
      changedAny = true;
    }
  }
  if (changedAny) saveStore();
})();

let saveTimer = null;
function setSaveState(state){
  const el = document.getElementById("save-state"); if (!el) return;
  const labels = { unsaved:"Unsaved", "saved-local":"Saved locally", "saved-repo":"Downloaded — commit to repo", failed:"Save failed" };
  el.dataset.state = state;
  el.textContent = labels[state] || "";
}
function saveStore(){
  try {
    localStorage.setItem(SK, JSON.stringify(S));
    setSaveState("saved-local");
  } catch { setSaveState("failed"); }
}
function patchReview(id, patch){
  const r = ensureReview(id);
  Object.assign(r, patch);
  r.updated_at = new Date().toISOString();
  setSaveState("unsaved");
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveStore, 250);
}

// Best-effort fetch of rowan-review.json so committed values survive a fresh browser.
// Local edits (newer updated_at) win to avoid clobbering work in progress.
async function hydrateFromRepo(){
  try {
    const res = await fetch(ROWAN_REVIEW_PATH, { cache: "no-cache" });
    if (!res.ok) return;
    const remote = await res.json();
    if (!remote || typeof remote !== "object") return;
    let applied = 0;
    for (const [id, rRemote] of Object.entries(remote)){
      const rLocal = S[id];
      const remoteAt = rRemote && rRemote.updated_at ? Date.parse(rRemote.updated_at) : 0;
      const localAt  = rLocal  && rLocal.updated_at  ? Date.parse(rLocal.updated_at)  : 0;
      if (!rLocal || remoteAt > localAt || isDefaultOnlyReview(id, rLocal)){
        S[id] = { ...blankReview(), ...(rLocal || {}), ...rRemote };
        applied += 1;
      }
    }
    if (applied === 0) return;   // nothing newer remote — don't clobber focus / in-flight edits
    try { localStorage.setItem(SK, JSON.stringify(S)); } catch {}
    render();
  } catch { /* file:// or 404 — fine, localStorage-only */ }
}

function downloadRowanReview(){
  // Sort keys for stable diffs.
  const sorted = Object.keys(S).sort().reduce((acc, k) => { acc[k] = S[k]; return acc; }, {});
  const blob = new Blob([JSON.stringify(sorted, null, 2) + "\n"], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "rowan-review.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 0);
  setSaveState("saved-repo");
}

let sCol="pri",sDir=-1,fQ="",fSt="",fCt="",fLane="",fEv="",fHideArchived=true;

const sc=(v,c)=>{
  if(v===null||v===undefined)return"<span style='color:#ccc'>—</span>";
  const cls=c==="pri"?(v>=50?"s-ok":v>=35?"s-mid":"s-bad"):(v>=75?"s-ok":v>=55?"s-mid":"s-bad");
  return`<span class="${cls}">${v}</span>`;
};
const BDGE={"Ready to draft":"b-draft","Needs contact":"b-contact","Next wave":"b-wave2","Seed only":"b-seed","Warm":"b-warm","Unverified":"b-unver"};
// Per #722, technical findings stay flagged as "unverified" until a human or
// live-DOM check confirms a real visible issue. We render that flag inline
// next to the status badge so reviewers can see at a glance which rows still
// rest on Lighthouse signal alone.
const isUnverified=l=>l.verified==="no"||l.status==="Unverified";
const stars=(id,r)=>[1,2,3,4,5].map(i=>`<span class="star${i<=r?" on":""}" data-id="${id}" data-v="${i}">★</span>`).join("");

const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const opt=(v,sel,label)=>`<option value="${esc(v)}"${v===sel?" selected":""}>${esc(label||v||"—")}</option>`;
const selectOptions=(values,sel,labels)=>['<option value=""'+(sel?"":" selected")+'>—</option>',...values.map(v=>opt(v,sel,labels && labels[v] ? labels[v] : v))].join("");
const selectVerdict=(sel)=>['<option value=""'+(sel?"":" selected")+'>—</option>',...VERDICTS.map(([v,l])=>opt(v,sel,l))].join("");
const nextActionSearchText=value=>{
  const raw = String(value || "");
  if (!raw) return "";
  return [raw, raw.replace(/-/g, " "), NEXT_ACTION_LABELS[raw] || raw].join(" ");
};

// Sortable values for Rowan-owned columns key off the review record.
const NUMERIC_COLS = new Set(["perf","a11y","bp","seo","pri","rating"]);
function sortKey(l, col){
  const r = peekReview(l.id);
  switch(col){
    case "lane": return r.lane;
    case "lane_confidence": return r.lane_confidence;
    case "evidence": return r.evidence_status;
    case "draft_safe": return r.draft_safe ? 1 : 0;
    case "rating": return r.rating || 0;
    case "verdict": return r.verdict;
    case "next_action": return r.next_action;
    case "follow_up_date": return r.follow_up_date;
    case "notes": return r.notes;
    default: return l[col];
  }
}

function filt(){
  const numericSort = NUMERIC_COLS.has(sCol);
  // Empty/null sort sentinels: numeric columns use ±Infinity so missing
  // values consistently sort to one end; string columns use lex extremes.
  const lo = numericSort ? -Infinity : "";
  const hi = numericSort ?  Infinity : "￿";
  return L.filter(l=>{
    const r=peekReview(l.id);
    if(fHideArchived && (r.next_action==="skip" || r.next_action==="archive" || r.verdict==="skip")) return false;
    if(fQ){const q=fQ.toLowerCase();if(![l.name,l.cat,l.status,l.email||"",l.issue,l.gemini,l.brand,r.notes,r.lane,r.lane_confidence,r.evidence_status,r.verdict,r.next_action,nextActionSearchText(r.next_action)].join(" ").toLowerCase().includes(q))return false;}
    if(fSt&&l.status!==fSt)return false;
    if(fCt&&!l.cat.includes(fCt))return false;
    if(fLane&&(r.lane||"")!==fLane)return false;
    if(fEv&&(r.evidence_status||"")!==fEv)return false;
    return true;
  }).sort((a,b)=>{
    let av=sortKey(a,sCol),bv=sortKey(b,sCol);
    if(av===null||av===undefined||av==="")av=sDir===1?hi:lo;
    if(bv===null||bv===undefined||bv==="")bv=sDir===1?hi:lo;
    if(!numericSort){
      if(typeof av==="string")av=av.toLowerCase();
      if(typeof bv==="string")bv=bv.toLowerCase();
    }
    return av<bv?-sDir:av>bv?sDir:0;
  });
}

// Safe href for the lead's name link. Many entries are bare hosts ("dotcomme.net"),
// which browsers treat as a relative URL, and we never want javascript:/data: URIs
// reaching the DOM. Prefix https:// when missing; reject anything that isn't http(s).
function safeHref(url){
  const raw = String(url || "").trim();
  if (!raw) return "#";
  // Any non-http(s) scheme is rejected outright (covers javascript:, data:, ftp:, etc).
  if (/^[a-z][a-z0-9+.-]*:/i.test(raw) && !/^https?:\/\//i.test(raw)) return "#";
  const withScheme = /^https?:\/\//i.test(raw) ? raw : `https://${raw.replace(/^\/+/, "")}`;
  try {
    const u = new URL(withScheme);
    if (u.protocol !== "http:" && u.protocol !== "https:") return "#";
    return u.toString();
  } catch { return "#"; }
}

function render(){
  const list=filt();
  document.getElementById("ct").textContent=`${list.length} of ${L.length}`;
  const tb=document.getElementById("tb");
  tb.innerHTML=list.map(l=>{
    const r=peekReview(l.id);
    const id=esc(l.id);
    return`<tr class="${r.verdict==="rework"?"qa-rework":""}">
      <td class="pin"><a href="${esc(safeHref(l.url))}" target="_blank" rel="noopener noreferrer">${esc(l.name)}</a></td>
      <td>${esc(l.cat)}</td>
      <td><span class="badge ${BDGE[l.status]||"b-seed"}">${esc(l.status)}</span>${isUnverified(l)?'<span class="verflag" title="Technical findings unverified — Lighthouse signal only">unverified</span>':""}</td>
      <td style="font-size:11px">${l.email?`<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>`:`<span class="no-email">—</span>`}</td>
      <td class="gcell">${l.gemini?`<span class="gtag">${esc(l.gstatus || "Gemini")}</span>${esc(l.gemini)}`:""}</td>
      <td class="rowan"><textarea class="note" data-field="notes" data-id="${id}">${esc(r.notes||"")}</textarea></td>
      <td class="rowan"><select class="review" data-field="lane" data-id="${id}">${selectOptions(LANES,r.lane)}</select></td>
      <td class="rowan"><select class="review" data-field="lane_confidence" data-id="${id}">${selectOptions(LANE_CONFIDENCE,r.lane_confidence)}</select></td>
      <td class="rowan"><select class="review" data-field="evidence_status" data-id="${id}">${selectOptions(EVIDENCE,r.evidence_status)}</select></td>
      <td class="rowan"><select class="review" data-field="draft_safe" data-id="${id}">${selectOptions(["true","false"], r.draft_safe ? "true" : "false")}</select></td>
      <td class="rowan stars" data-sf="${id}">${stars(id,r.rating||0)}</td>
      <td class="rowan"><select class="verdict" data-field="verdict" data-id="${id}">${selectVerdict(r.verdict)}</select></td>
      <td class="rowan"><select class="review" data-field="next_action" data-id="${id}">${selectOptions(NEXT_ACTIONS,r.next_action,NEXT_ACTION_LABELS)}</select></td>
      <td class="rowan"><input class="follow-up" type="date" data-field="follow_up_date" data-id="${id}" value="${esc(r.follow_up_date||"")}"></td>
      <td class="sc">${sc(l.perf,"perf")}</td>
      <td class="sc">${sc(l.a11y,"a11y")}</td>
      <td class="sc">${sc(l.bp,"bp")}</td>
      <td class="sc">${sc(l.seo,"seo")}</td>
      <td class="sc">${sc(l.pri,"pri")}</td>
      <td style="font-size:11px;max-width:200px">${esc(l.issue)}</td>
      <td style="font-size:11px;max-width:180px;color:#555">${esc(l.angle)}</td>
      <td style="font-size:11px;max-width:160px;color:#666">${esc(l.brand)}</td>
      <td style="font-size:10px;max-width:220px;color:#888;font-family:ui-monospace,Menlo,Consolas,monospace">${esc(l.a11yNotes||"")}</td>
    </tr>`;
  }).join("");
  bindReviewHandlers(tb);
}

function bindStarHandlers(scope){
  scope.querySelectorAll(".star").forEach(el=>el.addEventListener("click",e=>{
    const id=e.target.dataset.id, v=parseInt(e.target.dataset.v,10);
    patchReview(id,{rating:v});
    document.querySelectorAll(`[data-sf="${id}"]`).forEach(c=>{c.innerHTML=stars(id,v);bindStarHandlers(c);});
  }));
}

function bindReviewHandlers(scope){
  bindStarHandlers(scope);
  scope.querySelectorAll("select.review, select.verdict").forEach(el=>el.addEventListener("change",e=>{
    const field = e.target.dataset.field;
    const raw = e.target.value;
    const value = field === "draft_safe" ? (raw !== "false") : raw;
    patchReview(e.target.dataset.id,{[field]:value});
  }));
  scope.querySelectorAll("input.follow-up").forEach(el=>el.addEventListener("change",e=>{
    const followUpDate=e.target.value===""?null:e.target.value;
    patchReview(e.target.dataset.id,{follow_up_date:followUpDate});
  }));
  scope.querySelectorAll("textarea.note").forEach(el=>el.addEventListener("input",e=>{
    patchReview(e.target.dataset.id,{notes:e.target.value});
  }));
}

document.querySelectorAll("th[data-c]").forEach(th=>th.addEventListener("click",()=>{
  const c=th.dataset.c;sDir=sCol===c?-sDir:-1;sCol=c;
  document.querySelectorAll("th").forEach(t=>t.classList.remove("sorted"));
  th.classList.add("sorted");render();
}));
document.getElementById("search").addEventListener("input",e=>{fQ=e.target.value;render();});
document.getElementById("fs").addEventListener("change",e=>{fSt=e.target.value;render();});
document.getElementById("fc").addEventListener("change",e=>{fCt=e.target.value;render();});
document.getElementById("fl").addEventListener("change",e=>{fLane=e.target.value;render();});
document.getElementById("fe").addEventListener("change",e=>{fEv=e.target.value;render();});
document.getElementById("show-archived").addEventListener("change",e=>{fHideArchived=!e.target.checked;render();});

function xcsv(){
  const cols=["Name","URL","Category","Status","Batch","Email","Gemini Findings","Notes (Rowan)","Lane","Lane Confidence","Evidence Status","Draft Safe","Rating","Verdict","Next Action","Follow-up Date","Updated At","Perf","A11y","BP","SEO","Priority","Issue","Outreach Angle","Brand Observation"];
  const rows=[cols,...L.map(l=>{
    const r=peekReview(l.id);
    return[l.name,l.url,l.cat,l.status,l.b,l.email||"",(l.gemini||'').replace(/\n/g,' '),(r.notes||'').replace(/\n/g,' '),r.lane||'',r.lane_confidence||'',r.evidence_status||'',(r.draft_safe?"true":"false"),r.rating||'',r.verdict||'',r.next_action||'',r.follow_up_date||'',r.updated_at||'',l.perf??'',l.a11y??'',l.bp??'',l.seo??'',l.pri??'',l.issue,l.angle,l.brand];
  })];
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="kspf-leads.csv";a.click();
}

// Session check — must run after render() is defined above
if (sessionStorage.getItem(SESSION_KEY) === "1") {
  unlock();
}
</script>
</body>
</html>
